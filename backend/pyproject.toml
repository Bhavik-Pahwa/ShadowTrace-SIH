[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowtrace-xai-backend"
version = "0.1.0"
description = "Offline FastAPI backend for ShadowTrace-XAI forensic Bitcoin anomaly detection."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "polars==1.32.3",
  "duckdb==1.3.2",
  "networkx==3.4.2",
  "geoip2==5.1.0",
  "jinja2==3.1.6",
  "weasyprint==66.0",
  "numpy==2.1.3",
  "scikit-learn==1.6.1",
  "shap==0.46.0",
  "torch==2.5.1",
  "torch-geometric==2.6.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[project.scripts]
shadowtrace-pipeline = "shadowtrace.cli:run_pipeline_main"
shadowtrace-verify-offline = "shadowtrace.cli:verify_offline_main"
shadowtrace-artifact-audit = "shadowtrace.cli:audit_artifacts_main"
shadowtrace-verify-bundle = "shadowtrace.cli:verify_bundle_main"
shadowtrace-build-bundle = "shadowtrace.cli:build_bundle_main"
shadowtrace-build-wheelhouse = "shadowtrace.cli:build_wheelhouse_main"

[tool.setuptools.packages.find]
include = ["shadowtrace*"]

[tool.setuptools.package-data]
shadowtrace = ["templates/*.html"]
